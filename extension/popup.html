<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绑定接收目标 · QuickShot</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <div class="brand"><img src="icons/48.png" alt=""><div><div class="eyebrow">QuickShot 2.0</div><h1>绑定这个聊天</h1></div></div>
  <p class="small">给当前网站设置投递快捷键。任意来源的新图片进入剪贴板后，在 10 秒内按下即可附图。</p>
  <div class="status" id="connection">正在检查连接…</div>
  <form id="bind-form" class="panel">
    <label for="name">接收目标名称</label><input id="name" maxlength="80" required placeholder="例如：DeepSeek 工作聊天">
    <label for="key">投递快捷键 · 点击后按键录入，最多 3 键</label><input id="key" class="key" required value="C" aria-label="投递快捷键">
    <label for="default-url">默认网址 · 没有目标网站标签页时打开</label><input id="default-url" type="url" required aria-label="默认网址">
    <button id="bind" type="submit" class="primary full">绑定当前页 · 下一步选择输入框</button>
    <div id="error" class="error" role="status"></div>
  </form>
  <div class="hint">点击按钮后，再点击网页里的聊天输入框。图片只会粘贴到草稿中，由你手动发送。</div>
  <button id="manage" class="link full" type="button">管理所有接收目标 →</button>
  <button id="reconnect" class="link full" type="button">启动 / 连接 QuickShot</button>
  <script type="module" src="popup.js"></script>
</body></html>
